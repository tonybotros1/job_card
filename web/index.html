<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Compass Job Card - workshop job cards">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Job Card">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Job Card</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; background: #F5F6F8; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #6B7280; transition: opacity .25s ease; z-index: 10; }
    #splash img { width: 96px; height: 96px; object-fit: contain; margin-bottom: 18px; }
    #splash .title { font-size: 16px; font-weight: 600; color: #141A24; margin-bottom: 6px; }
    #splash .bar { width: 160px; height: 4px; border-radius: 999px; background: #E6E8EC; overflow: hidden; margin-top: 18px; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #EA2027; border-radius: 999px;
      animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
    #splash.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div class="title">Job Card</div>
    <div>Loading the portal…</div>
    <div class="bar"></div>
  </div>
  <script>
    // Flutter fires this once the first frame is drawn.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.classList.add('hide'); setTimeout(function () { s.remove(); }, 300); }
    });
  </script>
  <!--
    Firebase is initialised by the Dart side (firebase_core in lib/main.dart);
    no JavaScript Firebase set-up belongs here. Background push messages are
    handled by firebase-messaging-sw.js, which the Firebase SDK registers itself.

    flutter_bootstrap.js is generated by the Flutter build and loads the app.
    See https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
